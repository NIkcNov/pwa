<!DOCTYPE html>
<html lang="ru">
<link rel="stylesheet" href="style.css">
<link rel="shortcut icon" href="icon.png" type="image/x-icon">
<link rel="manifest" href = "manifest.json">
<link rel="icon" href="icon-128x128.png">
<link rel = "apple-touch-icon" href="icon-192x192.png"

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE-edge">
    <meta name="vieport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#d4c1fe">
    <meta name="apple-mobile-web-app-status-bar" content="#d4c1fe">
    <title>Калькулятор ИМТ</title>
   
</head>
<body>
    <div class="container">
        <div class="header">
            <img src="icon.png" alt="logo" height="50" width="50">
            Калькулятор ИМТ
        </div>
        <div class="input-div">
            <label for="height">Ваш рост в сантиметрах</label>
            <input type="number" id="height">
        </div>
        <div class="input-div">
            <label for="weight">Ваш вес в килограмах</label>
            <input type="number" id="weight">
        </div>
        <div class="input-div">
            <label for="output">Ваш ИМТ</label>
            <input type="number" readonly id="output">
        </div>
        <div class="input-div">
            <button id="btn">Посчитать ИМТ</button>
        </div>
    </div>
    <script src="app.js"></script>

</body>
</html>
